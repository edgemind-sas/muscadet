<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1000" width="1160" height="1000" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <rect x="0" y="0" width="1160" height="1000" fill="#ffffff"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#546e7a"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
    </marker>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <text x="40" y="44" font-size="22" font-weight="600" fill="#263238">Le sur-tirage : le réactif abondant est prélevé à plein, et le surplus disparaît</text>
  <text x="40" y="69" font-size="14" fill="#607d8b">Mesuré sur la tranche H2 déjà portée. La règle : 4 H2O + 1 Elec → 1 H2 + 1 O2.</text>

  <!-- =============== PANNEAU GAUCHE : AUJOURD'HUI =============== -->
  <rect x="40" y="92" width="520" height="600" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.8"/>
  <text x="62" y="121" font-size="16" font-weight="700" fill="#b71c1c">AUJOURD'HUI</text>

  <!-- sources -->
  <rect x="62" y="140" width="212" height="72" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="1.2"/>
  <text x="76" y="162" font-size="13" font-weight="600" fill="#37474f">S_H2O — source</text>
  <text x="76" y="182" font-size="12" fill="#546e7a">débit 2 · rare</text>
  <text x="76" y="200" font-size="12" fill="#546e7a">pas de stock</text>

  <rect x="290" y="140" width="248" height="72" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="1.2"/>
  <text x="304" y="162" font-size="13" font-weight="600" fill="#37474f">B1 — batterie Elec</text>
  <text x="304" y="182" font-size="12" fill="#546e7a">stock 100 · abondant</text>
  <text x="304" y="200" font-size="12" font-weight="600" fill="#b71c1c">c'est elle qui paie</text>

  <line x1="168" y1="212" x2="168" y2="292" stroke="#546e7a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="180" y="238" font-size="12" fill="#37474f">demandé  4</text>
  <text x="180" y="256" font-size="12" fill="#37474f">livré    2</text>
  <text x="180" y="274" font-size="12" font-weight="600" fill="#2e7d32">consommé 2  ✓</text>

  <line x1="414" y1="212" x2="414" y2="292" stroke="#c62828" stroke-width="2" marker-end="url(#arRed)"/>
  <text x="426" y="238" font-size="12" fill="#37474f">demandé  1,0</text>
  <text x="426" y="256" font-size="12" fill="#37474f">livré    1,0</text>
  <text x="426" y="274" font-size="12" font-weight="600" fill="#b71c1c">consommé 0,5  ✗</text>

  <!-- electro -->
  <rect x="62" y="294" width="476" height="96" rx="6" fill="#ffffff" stroke="#37474f" stroke-width="1.6"/>
  <text x="76" y="317" font-size="13.5" font-weight="600" fill="#263238">Electro</text>
  <text x="76" y="339" font-size="12.5" fill="#455a64">L'échelle est fixée par le réactif LIMITANT :</text>
  <text x="76" y="361" font-size="13" font-weight="600" fill="#263238" font-family="ui-monospace, monospace">échelle = min(2/4 , 1/1) = 0,5</text>
  <text x="76" y="381" font-size="12.5" fill="#455a64">H2O est consommé en entier. Elec ne l'est qu'à moitié.</text>

  <line x1="200" y1="390" x2="200" y2="446" stroke="#2e7d32" stroke-width="2" marker-end="url(#arGreen)"/>
  <text x="212" y="418" font-size="12" fill="#2e7d32">H2 0,5 · O2 0,5</text>

  <line x1="430" y1="390" x2="430" y2="446" stroke="#c62828" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arRed)"/>
  <text x="442" y="422" font-size="12.5" font-weight="600" fill="#b71c1c">0,5 · nulle part</text>

  <rect x="62" y="448" width="290" height="52" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="76" y="470" font-size="12.5" font-weight="600" fill="#1b5e20">Local — réservoir H2</text>
  <text x="76" y="490" font-size="12" fill="#33691e">reçoit 0,5 par unité de temps</text>

  <rect x="374" y="448" width="164" height="52" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.4"/>
  <text x="388" y="470" font-size="12.5" font-weight="700" fill="#b71c1c">DÉTRUIT</text>
  <text x="388" y="490" font-size="12" fill="#b71c1c">ni stocké, ni produit</text>

  <rect x="62" y="516" width="476" height="156" rx="6" fill="#ffffff" stroke="#e57373" stroke-width="1.2"/>
  <text x="76" y="540" font-size="13" font-weight="600" fill="#b71c1c">Ce que ça coûte, sur 5 unités de temps</text>
  <text x="76" y="564" font-size="12.5" fill="#4e342e">La batterie descend de 100 à 95, alors que la réaction n'en</text>
  <text x="76" y="581" font-size="12.5" fill="#4e342e">justifie que 2,5. La moitié de l'énergie tirée n'a rien produit.</text>
  <text x="76" y="608" font-size="12.5" fill="#4e342e">Sur une source infinie, invisible : rien ne s'y épuise. C'est</text>
  <text x="76" y="625" font-size="12.5" fill="#4e342e">l'existence d'un STOCK derrière le réactif abondant qui</text>
  <text x="76" y="642" font-size="12.5" fill="#4e342e">transforme l'écart comptable en matière perdue.</text>
  <text x="76" y="664" font-size="12.5" font-style="italic" fill="#b71c1c">Le modèle tourne, se termine, et rend des chiffres faux.</text>

  <!-- =============== PANNEAU DROIT : PRECONISE =============== -->
  <rect x="600" y="92" width="520" height="600" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/>
  <text x="622" y="121" font-size="16" font-weight="700" fill="#1b5e20">CE QUE JE PRÉCONISE</text>

  <rect x="622" y="140" width="476" height="118" rx="6" fill="#ffffff" stroke="#66bb6a" stroke-width="1.3"/>
  <text x="636" y="164" font-size="13.5" font-weight="600" fill="#1b5e20">Plafonner le prélèvement, pas la demande</text>
  <text x="636" y="188" font-size="12.5" fill="#33691e">L'échelle est déjà connue au moment où la passe de</text>
  <text x="636" y="205" font-size="12.5" fill="#33691e">production s'exécute. Il suffit de s'en servir :</text>
  <text x="636" y="232" font-size="13.5" font-weight="600" fill="#1b5e20" font-family="ui-monospace, monospace">prélèvement = échelle × coefficient</text>
  <text x="636" y="251" font-size="12.5" fill="#33691e">soit 0,5 × 1 = 0,5 au lieu de 1,0</text>

  <line x1="860" y1="258" x2="860" y2="300" stroke="#2e7d32" stroke-width="2" marker-end="url(#arGreen)"/>

  <rect x="622" y="302" width="476" height="118" rx="6" fill="#ffffff" stroke="#66bb6a" stroke-width="1.3"/>
  <text x="636" y="326" font-size="13.5" font-weight="600" fill="#1b5e20">Ce que ça rétablit</text>
  <text x="636" y="350" font-size="12.5" fill="#33691e">La batterie descend de 100 à 97,5 sur 5 unités : exactement</text>
  <text x="636" y="367" font-size="12.5" fill="#33691e">ce que la réaction consomme.</text>
  <text x="636" y="392" font-size="12.5" font-weight="600" fill="#1b5e20">Conservation rétablie : ce qui sort d'un fournisseur entre</text>
  <text x="636" y="409" font-size="12.5" font-weight="600" fill="#1b5e20">dans une réaction, un stock ou une sortie. Rien ne s'évapore.</text>

  <rect x="622" y="440" width="476" height="112" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="1.3"/>
  <text x="636" y="464" font-size="13.5" font-weight="600" fill="#e65100">Ce que ça ne corrige PAS</text>
  <text x="636" y="488" font-size="12.5" fill="#5d4037">La demande publiée reste sur-évaluée. Tant qu'un seul</text>
  <text x="636" y="505" font-size="12.5" fill="#5d4037">consommateur est en jeu, sans effet. Mais si deux</text>
  <text x="636" y="522" font-size="12.5" fill="#5d4037">composants se disputent une ressource rare, le partage</text>
  <text x="636" y="539" font-size="12.5" fill="#5d4037">reste faussé au prorata de demandes trop grandes.</text>

  <rect x="622" y="572" width="476" height="100" rx="6" fill="#ffffff" stroke="#66bb6a" stroke-width="1.3"/>
  <text x="636" y="596" font-size="13.5" font-weight="600" fill="#1b5e20">Pourquoi le faire quand même, et maintenant</text>
  <text x="636" y="620" font-size="12.5" fill="#33691e">Corriger la demande exige une seconde passe ou une</text>
  <text x="636" y="637" font-size="12.5" fill="#33691e">résolution itérative — un chantier. Le prélèvement, non.</text>
  <text x="636" y="659" font-size="12.5" font-weight="600" fill="#1b5e20">Un problème borné réglé maintenant vaut mieux qu'un</text>

  <!-- =============== BANDEAU BAS =============== -->
  <rect x="40" y="712" width="1080" height="120" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
  <text x="62" y="740" font-size="15" font-weight="700" fill="#263238">Deux problèmes distincts, souvent confondus — et c'est ce qui bloquait</text>

  <rect x="62" y="754" width="516" height="62" rx="5" fill="#ffffff" stroke="#c62828" stroke-width="1.2"/>
  <text x="76" y="775" font-size="13" font-weight="600" fill="#b71c1c">SUR-TIRAGE — passe de production · borné</text>
  <text x="76" y="795" font-size="12" fill="#455a64">Viole la conservation. Corrigeable seul, sans toucher à la demande.</text>
  <text x="76" y="810" font-size="12" font-weight="600" fill="#b71c1c">→ à faire avant d'élargir le portage</text>

  <rect x="596" y="754" width="502" height="62" rx="5" fill="#ffffff" stroke="#f57f17" stroke-width="1.2"/>
  <text x="610" y="775" font-size="13" font-weight="600" fill="#e65100">SUR-DEMANDE — passe de demande · chantier</text>
  <text x="610" y="795" font-size="12" fill="#455a64">Fausse l'allocation entre consommateurs rivaux. Demande un solveur.</text>
  <text x="610" y="810" font-size="12" font-weight="600" fill="#e65100">→ limite de conception, à instruire à part</text>

  <text x="40" y="866" font-size="12.5" fill="#607d8b">Les traiter ensemble faisait paraître l'ensemble hors de portée. Séparés, l'un se règle en une passe et l'autre reste une décision.</text>
  <text x="40" y="890" font-size="12.5" fill="#607d8b">Aucun des deux ne dépend des arbitrages en attente sur le dérating ou le nominal.</text>

</svg>
