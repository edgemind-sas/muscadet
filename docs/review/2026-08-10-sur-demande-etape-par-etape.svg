<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" width="1200" height="1010" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <rect x="0" y="0" width="1200" height="1010" fill="#ffffff"/>
  <defs>
    <marker id="mD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/></marker>
    <marker id="mP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/></marker>
    <marker id="mB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/></marker>
    <marker id="mR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00838f"/></marker>
  </defs>

  <text x="40" y="42" font-size="21" font-weight="600" fill="#263238">Une ressource, deux rivaux — le système redessiné à chaque étape</text>
  <text x="40" y="66" font-size="13.5" fill="#607d8b">Flèches bleues vers la gauche : la demande qui remonte. Flèches vertes vers la droite : la production qui descend.</text>
  <text x="40" y="85" font-size="13.5" fill="#607d8b">U1 : 10 A + 1 E → 1 P1, bridé par A. U2 : 1 E → 1 P2, bridé par rien. SE ne peut donner que 1,0 en tout.</text>

  <!-- ============ ETAPE 1 ============ -->
  <rect x="40" y="100" width="555" height="240" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="58" y="126" font-size="14" font-weight="700" fill="#0d47a1">1 · La demande remonte  —  evaluate_demand</text>

  <rect x="54" y="152" width="80" height="32" rx="4" fill="#fff" stroke="#546e7a"/><text x="62" y="172" font-size="11.5" font-weight="600" fill="#37474f">SA · 1,0</text>
  <rect x="54" y="222" width="80" height="32" rx="4" fill="#fff3e0" stroke="#ef6c00"/><text x="62" y="242" font-size="11.5" font-weight="600" fill="#e65100">SE · 1,0</text>
  <rect x="180" y="146" width="135" height="44" rx="4" fill="#fff" stroke="#37474f"/><text x="190" y="164" font-size="11.5" font-weight="600" fill="#263238">U1</text><text x="190" y="180" font-size="10.5" fill="#546e7a">10 A + 1 E → 1 P1</text>
  <rect x="180" y="218" width="135" height="44" rx="4" fill="#fff" stroke="#37474f"/><text x="190" y="236" font-size="11.5" font-weight="600" fill="#263238">U2</text><text x="190" y="252" font-size="10.5" fill="#546e7a">1 E → 1 P2</text>
  <rect x="352" y="152" width="96" height="32" rx="4" fill="#fff" stroke="#546e7a"/><text x="360" y="172" font-size="11.5" fill="#37474f">K1 · veut 1000</text>
  <rect x="352" y="222" width="96" height="32" rx="4" fill="#fff" stroke="#546e7a"/><text x="360" y="242" font-size="11.5" fill="#37474f">K2 · veut 1</text>

  <line x1="350" y1="168" x2="318" y2="168" stroke="#1565c0" stroke-width="1.8" marker-end="url(#mD)"/>
  <text x="322" y="142" font-size="11" font-weight="600" fill="#0d47a1">1000</text>
  <line x1="350" y1="238" x2="318" y2="238" stroke="#1565c0" stroke-width="1.8" marker-end="url(#mD)"/>
  <text x="330" y="214" font-size="11" font-weight="600" fill="#0d47a1">1</text>
  <line x1="178" y1="162" x2="138" y2="166" stroke="#1565c0" stroke-width="1.8" marker-end="url(#mD)"/>
  <text x="136" y="146" font-size="11" font-weight="600" fill="#0d47a1">A : 10000</text>
  <line x1="178" y1="182" x2="138" y2="228" stroke="#1565c0" stroke-width="1.8" marker-end="url(#mD)"/>
  <text x="146" y="204" font-size="11" font-weight="700" fill="#b71c1c">E : 1000</text>
  <line x1="178" y1="240" x2="138" y2="240" stroke="#1565c0" stroke-width="1.8" marker-end="url(#mD)"/>
  <text x="142" y="262" font-size="11" font-weight="600" fill="#0d47a1">E : 1</text>

  <text x="58" y="292" font-size="11.5" fill="#0d47a1">La demande = coefficient × demande aval. U1 réclame 1000 de E parce que son AVAL</text>
  <text x="58" y="309" font-size="11.5" fill="#0d47a1">en veut 1000 — et personne ne regarde que SA ne pourra jamais le laisser aller si haut.</text>
  <text x="58" y="329" font-size="11.5" font-weight="700" fill="#b71c1c">À cet instant, A n'existe pas dans le calcul de la demande sur E.</text>

  <!-- ============ ETAPE 2 ============ -->
  <rect x="613" y="100" width="547" height="240" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="631" y="126" font-size="14" font-weight="700" fill="#b71c1c">2 · SE partage au prorata  —  split_proportional</text>

  <rect x="627" y="152" width="80" height="32" rx="4" fill="#fff" stroke="#546e7a"/><text x="635" y="172" font-size="11.5" font-weight="600" fill="#37474f">SA · 1,0</text>
  <rect x="627" y="222" width="80" height="32" rx="4" fill="#ffcdd2" stroke="#c62828" stroke-width="1.4"/><text x="635" y="242" font-size="11.5" font-weight="700" fill="#b71c1c">SE · 1,0</text>
  <rect x="753" y="146" width="135" height="44" rx="4" fill="#fff" stroke="#37474f"/><text x="763" y="164" font-size="11.5" font-weight="600" fill="#263238">U1</text><text x="763" y="180" font-size="10.5" fill="#546e7a">a demandé 1000</text>
  <rect x="753" y="218" width="135" height="44" rx="4" fill="#fff" stroke="#37474f"/><text x="763" y="236" font-size="11.5" font-weight="600" fill="#263238">U2</text><text x="763" y="252" font-size="10.5" fill="#546e7a">a demandé 1</text>
  <rect x="925" y="152" width="96" height="32" rx="4" fill="#fafafa" stroke="#b0bec5"/><text x="933" y="172" font-size="11.5" fill="#90a4ae">K1</text>
  <rect x="925" y="222" width="96" height="32" rx="4" fill="#fafafa" stroke="#b0bec5"/><text x="933" y="242" font-size="11.5" fill="#90a4ae">K2</text>

  <line x1="709" y1="166" x2="751" y2="162" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#mP)"/>
  <text x="706" y="146" font-size="11" font-weight="600" fill="#1b5e20">A : 1,0</text>
  <line x1="711" y1="228" x2="751" y2="182" stroke="#c62828" stroke-width="2.6" marker-end="url(#mB)"/>
  <text x="716" y="204" font-size="11.5" font-weight="700" fill="#b71c1c">E : 0,999</text>
  <line x1="711" y1="240" x2="751" y2="240" stroke="#c62828" stroke-width="1.2" marker-end="url(#mB)"/>
  <text x="713" y="262" font-size="11.5" font-weight="700" fill="#b71c1c">E : 0,001</text>

  <text x="631" y="292" font-size="11.5" fill="#4e342e">1,0 partagé au prorata de 1000 contre 1. L'épaisseur des flèches est le partage réel.</text>
  <text x="631" y="312" font-size="11.5" font-weight="700" fill="#b71c1c">U2, que rien ne bride, reçoit un millième. Le partage est décidé — et il ne sera plus revu.</text>
  <text x="631" y="331" font-size="11.5" fill="#4e342e">SA livre 1,0 : sa demande de 10000 dépassait déjà ce qu'il possède.</text>

  <!-- ============ ETAPE 3 ============ -->
  <rect x="40" y="356" width="555" height="240" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="58" y="382" font-size="14" font-weight="700" fill="#1b5e20">3 · La production descend, l'échelle se révèle  —  rule_scale</text>

  <rect x="54" y="408" width="80" height="32" rx="4" fill="#fff" stroke="#546e7a"/><text x="62" y="428" font-size="11.5" font-weight="600" fill="#37474f">SA</text>
  <rect x="54" y="478" width="80" height="32" rx="4" fill="#fff3e0" stroke="#ef6c00"/><text x="62" y="498" font-size="11.5" font-weight="600" fill="#e65100">SE</text>
  <rect x="180" y="402" width="135" height="44" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.6"/><text x="190" y="420" font-size="11.5" font-weight="600" fill="#263238">U1</text><text x="190" y="436" font-size="10.5" font-weight="700" fill="#e65100">échelle = 0,1</text>
  <rect x="180" y="474" width="135" height="44" rx="4" fill="#fff" stroke="#37474f"/><text x="190" y="492" font-size="11.5" font-weight="600" fill="#263238">U2</text><text x="190" y="508" font-size="10.5" fill="#b71c1c">échelle = 0,001</text>
  <rect x="352" y="408" width="96" height="32" rx="4" fill="#fff" stroke="#546e7a"/><text x="360" y="428" font-size="11.5" fill="#37474f">K1</text>
  <rect x="352" y="478" width="96" height="32" rx="4" fill="#fff" stroke="#546e7a"/><text x="360" y="498" font-size="11.5" fill="#37474f">K2</text>

  <line x1="136" y1="422" x2="178" y2="418" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#mP)"/>
  <text x="133" y="402" font-size="11" fill="#1b5e20">A : 1,0</text>
  <line x1="138" y1="484" x2="178" y2="438" stroke="#2e7d32" stroke-width="2.6" marker-end="url(#mP)"/>
  <text x="143" y="460" font-size="11" fill="#1b5e20">E : 0,999</text>
  <line x1="138" y1="496" x2="178" y2="496" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#mP)"/>
  <text x="140" y="518" font-size="11" fill="#1b5e20">E : 0,001</text>
  <line x1="317" y1="424" x2="350" y2="424" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#mP)"/>
  <text x="316" y="402" font-size="11" font-weight="600" fill="#1b5e20">P1 : 0,1</text>
  <line x1="317" y1="496" x2="350" y2="496" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#mP)"/>
  <text x="310" y="518" font-size="11" font-weight="700" fill="#b71c1c">P2 : 0,001</text>

  <text x="58" y="548" font-size="11.5" font-weight="600" fill="#1b5e20" font-family="ui-monospace, monospace">U1 : min(A 1,0/10 = 0,1 ; E 0,999/1 = 0,999) = 0,1</text>
  <text x="58" y="568" font-size="11.5" fill="#33691e">La vérité arrive ici : U1 n'aura jamais pu consommer plus de 0,1 de E. Il en détient 0,999.</text>
  <text x="58" y="587" font-size="11.5" font-weight="700" fill="#b71c1c">Et U2, faute de E, ne produit que 0,001 de P2 au lieu des 0,909 qu'il pouvait.</text>

  <!-- ============ ETAPE 4 ============ -->
  <rect x="613" y="356" width="547" height="240" rx="8" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/>
  <text x="631" y="382" font-size="14" font-weight="700" fill="#006064">4 · U1 rend ce qu'il n'a pas pris  —  release_unused_supply</text>

  <rect x="627" y="408" width="80" height="32" rx="4" fill="#fff" stroke="#546e7a"/><text x="635" y="428" font-size="11.5" font-weight="600" fill="#37474f">SA</text>
  <rect x="627" y="478" width="80" height="32" rx="4" fill="#b2ebf2" stroke="#00838f" stroke-width="1.5"/><text x="635" y="498" font-size="11.5" font-weight="700" fill="#006064">SE</text>
  <rect x="753" y="402" width="135" height="44" rx="4" fill="#fff" stroke="#37474f"/><text x="763" y="420" font-size="11.5" font-weight="600" fill="#263238">U1</text><text x="763" y="436" font-size="10.5" fill="#546e7a">consomme 0,1 de E</text>
  <rect x="753" y="474" width="135" height="44" rx="4" fill="#fff" stroke="#37474f"/><text x="763" y="492" font-size="11.5" font-weight="600" fill="#263238">U2</text><text x="763" y="508" font-size="10.5" fill="#b71c1c">toujours 0,001</text>
  <rect x="925" y="408" width="96" height="32" rx="4" fill="#fff" stroke="#546e7a"/><text x="933" y="428" font-size="11.5" fill="#37474f">K1</text>
  <rect x="925" y="478" width="96" height="32" rx="4" fill="#fff" stroke="#546e7a"/><text x="933" y="498" font-size="11.5" fill="#37474f">K2</text>

  <line x1="709" y1="422" x2="751" y2="418" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#mP)"/>
  <text x="706" y="402" font-size="11" fill="#1b5e20">A : 1,0</text>
  <line x1="711" y1="484" x2="751" y2="438" stroke="#2e7d32" stroke-width="1.4" marker-end="url(#mP)"/>
  <text x="716" y="456" font-size="11" font-weight="600" fill="#1b5e20">E : 0,1</text>
  <line x1="751" y1="452" x2="711" y2="492" stroke="#00838f" stroke-width="2.6" stroke-dasharray="5 3" marker-end="url(#mR)"/>
  <text x="700" y="472" font-size="11" font-weight="700" fill="#006064">rend 0,899</text>
  <line x1="711" y1="496" x2="751" y2="496" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#mP)"/>
  <line x1="890" y1="424" x2="923" y2="424" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#mP)"/>
  <text x="889" y="402" font-size="11" fill="#1b5e20">P1 : 0,1</text>

  <text x="631" y="548" font-size="11.5" fill="#00695c">Corrigé (9c5e647, ef7c6b4). Le prélèvement suit la production : plus rien n'est détruit,</text>
  <text x="631" y="568" font-size="11.5" fill="#00695c">et derrière un stock, ce stock ne se vide plus pour rien.</text>
  <text x="631" y="587" font-size="11.5" font-weight="700" fill="#006064">Mais U2 n'en voit pas un gramme : sa part a été fixée à l'étape 2.</text>

  <!-- ============ ETAPE 5 ============ -->
  <rect x="40" y="612" width="555" height="240" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.8"/>
  <text x="58" y="638" font-size="14" font-weight="700" fill="#b71c1c">5 · Le partage n'est jamais revu  —  ce qui reste ouvert</text>

  <rect x="54" y="664" width="80" height="32" rx="4" fill="#fff" stroke="#546e7a"/><text x="62" y="684" font-size="11.5" font-weight="600" fill="#37474f">SA</text>
  <rect x="54" y="734" width="80" height="46" rx="4" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/><text x="62" y="752" font-size="11.5" font-weight="700" fill="#b71c1c">SE</text><text x="62" y="768" font-size="10" fill="#b71c1c">0,899 dispo</text>
  <rect x="180" y="658" width="135" height="44" rx="4" fill="#fff" stroke="#37474f"/><text x="190" y="676" font-size="11.5" font-weight="600" fill="#263238">U1</text><text x="190" y="692" font-size="10.5" fill="#546e7a">se contente de 0,1</text>
  <rect x="180" y="730" width="135" height="44" rx="4" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/><text x="190" y="748" font-size="11.5" font-weight="700" fill="#b71c1c">U2 — affamé</text><text x="190" y="764" font-size="10.5" font-weight="600" fill="#b71c1c">0,001 au lieu de 0,909</text>
  <rect x="352" y="664" width="96" height="32" rx="4" fill="#fff" stroke="#546e7a"/><text x="360" y="684" font-size="11.5" fill="#37474f">K1</text>
  <rect x="352" y="734" width="96" height="32" rx="4" fill="#fff" stroke="#546e7a"/><text x="360" y="754" font-size="11.5" fill="#37474f">K2</text>

  <line x1="136" y1="678" x2="178" y2="674" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#mP)"/>
  <line x1="138" y1="740" x2="178" y2="694" stroke="#2e7d32" stroke-width="1.4" marker-end="url(#mP)"/>
  <text x="143" y="716" font-size="11" fill="#1b5e20">0,1</text>
  <line x1="138" y1="752" x2="178" y2="752" stroke="#c62828" stroke-width="1.2" marker-end="url(#mB)"/>
  <text x="136" y="774" font-size="11" font-weight="700" fill="#b71c1c">0,001</text>
  <line x1="317" y1="680" x2="350" y2="680" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#mP)"/>
  <line x1="317" y1="752" x2="350" y2="752" stroke="#c62828" stroke-width="1.2" marker-end="url(#mB)"/>

  <path d="M 94 776 q -24 22 4 22 q 40 0 82 -22" fill="none" stroke="#c62828" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="106" y="812" font-size="11" font-weight="700" fill="#b71c1c">les 0,899 restent chez SE, jamais réofferts à U2</text>

  <text x="58" y="836" font-size="11.5" font-weight="700" fill="#b71c1c">SE a déjà tourné : l'ordre de production est topologique, il ne repasse pas.</text>

  <!-- ============ CONCLUSION ============ -->
  <rect x="613" y="612" width="547" height="240" rx="8" fill="#ede7f6" stroke="#4527a0" stroke-width="1.8"/>
  <text x="631" y="638" font-size="14" font-weight="700" fill="#311b92">Ce qu'il faudrait, et où</text>

  <text x="631" y="666" font-size="12" fill="#4527a0">Le défaut n'est dans aucune étape : chacune fait exactement ce</text>
  <text x="631" y="684" font-size="12" fill="#4527a0">qu'elle annonce. Il est dans leur ORDRE — la demande est calculée</text>
  <text x="631" y="702" font-size="12" fill="#4527a0">une passe avant l'échelle qui révèle qu'elle était irréalisable.</text>

  <rect x="631" y="716" width="510" height="60" rx="5" fill="#fff" stroke="#7e57c2" stroke-width="1.3"/>
  <text x="645" y="736" font-size="12" font-weight="600" fill="#311b92">À l'étape 1, U1 devrait pouvoir borner sa demande sur E par</text>
  <text x="645" y="756" font-size="12.5" font-weight="700" fill="#4527a0" font-family="ui-monospace, monospace">min(sur les AUTRES entrées : capacité ÷ coefficient)</text>
  <text x="645" y="770" font-size="11" fill="#4527a0">soit min(SA : 1,0/10) = 0,1 — au lieu de 1000.</text>

  <text x="631" y="798" font-size="12" fill="#4527a0">C'est la capacité des fournisseurs, que le min(capacité, demande)</text>
  <text x="631" y="816" font-size="12" fill="#4527a0">d'une livraison détruit et qu'aucun retard ne récupère. Il faut une</text>
  <text x="631" y="834" font-size="12" font-weight="700" fill="#311b92">troisième passe qui la publie. Partage obtenu : 0,0909 / 0,909.</text>

  <text x="40" y="884" font-size="12" fill="#607d8b">Étapes 3 et 4 corrigées. Étape 5 ouverte : c'est l'objet de la question sur la sur-demande.</text>
  <text x="40" y="903" font-size="12" fill="#607d8b">Sévérité : 0,001 avec une demande aval non bornée — le cas normal d'un réservoir. 0,5 au lieu de 0,909 avec une demande modeste.</text>
  <text x="40" y="922" font-size="12" fill="#607d8b">Mesuré sur muscadet à 6b73a48, allocation proportionnelle par défaut.</text>

</svg>
