<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 500" width="1060" height="500"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <rect x="0" y="0" width="1060" height="500" fill="#ffffff"/>

  <defs>
    <marker id="tp-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/></marker>
    <marker id="tp-move" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a1b9a"/></marker>
  </defs>

  <text x="36" y="44" font-size="24" font-weight="700" fill="#212121">The two shapes of a transfer pair</text>

  <g id="conduit">
    <rect x="36" y="76" width="988" height="182" rx="9" fill="#f3f7fb" stroke="#1565c0" stroke-width="2"/>
    <text x="58" y="108" font-size="18" font-weight="700" fill="#0d47a1">CONDUIT · flows = ("heat", "heat")</text>

    <rect x="80" y="152" width="112" height="60" rx="6" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="136" y="188" font-size="15" font-weight="600" fill="#263238" text-anchor="middle">upstream</text>

    <rect x="356" y="140" width="228" height="84" rx="7" fill="#ffffff" stroke="#0d47a1" stroke-width="2.5"/>
    <text x="470" y="166" font-size="16" font-weight="700" fill="#0d47a1" text-anchor="middle">component</text>
    <text x="470" y="190" font-size="14" fill="#6a1b9a" text-anchor="middle">the pair writes the flow</text>
    <text x="470" y="212" font-size="14" fill="#9e9e9e" text-anchor="middle" text-decoration="line-through">identity transfer</text>

    <rect x="748" y="152" width="112" height="60" rx="6" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="804" y="188" font-size="15" font-weight="600" fill="#263238" text-anchor="middle">downstream</text>

    <line x1="192" y1="182" x2="348" y2="182" stroke="#37474f" stroke-width="4" marker-end="url(#tp-flow)"/>
    <text x="270" y="172" font-size="15" fill="#37474f" text-anchor="middle" font-weight="600">Q</text>
    <line x1="584" y1="182" x2="740" y2="182" stroke="#37474f" stroke-width="4" marker-end="url(#tp-flow)"/>
    <text x="662" y="172" font-size="15" fill="#37474f" text-anchor="middle" font-weight="600">Q</text>

    <text x="890" y="176" font-size="15" font-weight="700" fill="#0d47a1">meters the transit</text>
    <text x="890" y="198" font-size="15" fill="#0d47a1">flow LEAVES the residue</text>
  </g>

  <g id="two-flow">
    <rect x="36" y="278" width="988" height="196" rx="9" fill="#f6f3fb" stroke="#6a1b9a" stroke-width="2"/>
    <text x="58" y="310" font-size="18" font-weight="700" fill="#4a148c">TWO FLOWS · flows = ("heat_water", "heat_air")</text>

    <rect x="80" y="342" width="112" height="42" rx="6" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="136" y="369" font-size="15" font-weight="600" fill="#263238" text-anchor="middle">water</text>
    <rect x="80" y="400" width="112" height="42" rx="6" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="136" y="427" font-size="15" font-weight="600" fill="#263238" text-anchor="middle">air</text>

    <rect x="356" y="332" width="228" height="120" rx="7" fill="#ffffff" stroke="#4a148c" stroke-width="2.5"/>
    <text x="470" y="356" font-size="16" font-weight="700" fill="#4a148c" text-anchor="middle">exchanger</text>
    <line x1="372" y1="382" x2="568" y2="382" stroke="#37474f" stroke-width="3.5" marker-end="url(#tp-flow)"/>
    <line x1="372" y1="434" x2="568" y2="434" stroke="#37474f" stroke-width="3.5" marker-end="url(#tp-flow)"/>
    <path d="M 470 390 L 470 426" stroke="#6a1b9a" stroke-width="5" marker-end="url(#tp-move)"/>
    <text x="498" y="414" font-size="16" font-weight="700" fill="#6a1b9a">Q</text>

    <rect x="748" y="342" width="112" height="42" rx="6" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="804" y="369" font-size="15" font-weight="600" fill="#263238" text-anchor="middle">water − Q</text>
    <rect x="748" y="400" width="112" height="42" rx="6" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="804" y="427" font-size="15" font-weight="600" fill="#263238" text-anchor="middle">air + Q</text>

    <line x1="192" y1="363" x2="348" y2="363" stroke="#37474f" stroke-width="4" marker-end="url(#tp-flow)"/>
    <line x1="192" y1="421" x2="348" y2="421" stroke="#37474f" stroke-width="4" marker-end="url(#tp-flow)"/>
    <line x1="584" y1="363" x2="740" y2="363" stroke="#37474f" stroke-width="4" marker-end="url(#tp-flow)"/>
    <line x1="584" y1="421" x2="740" y2="421" stroke="#37474f" stroke-width="4" marker-end="url(#tp-flow)"/>

    <text x="890" y="378" font-size="15" font-weight="700" fill="#4a148c">signed delta on top</text>
    <text x="890" y="400" font-size="15" fill="#4a148c">both flows STAY</text>
    <text x="890" y="422" font-size="15" fill="#4a148c">in the residue</text>
  </g>
</svg>
