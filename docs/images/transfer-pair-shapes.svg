<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <rect x="0" y="0" width="1120" height="620" fill="#ffffff"/>

  <defs>
    <marker id="tp-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/></marker>
    <marker id="tp-move" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a1b9a"/></marker>
    <marker id="tp-gone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bdbdbd"/></marker>
  </defs>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#212121">Un couple de transfert : deux formes, deux chemins</text>
  <text x="40" y="74" font-size="17" fill="#546e7a">La distinction porte sur le transfert identité, et les confondre casse celle qui perd.</text>

  <g id="conduit">
    <rect x="40" y="104" width="1040" height="216" rx="10" fill="#f3f7fb" stroke="#1565c0" stroke-width="2"/>
    <text x="64" y="138" font-size="20" font-weight="700" fill="#0d47a1">CONDUIT · flows = ("chaleur", "chaleur")</text>
    <text x="64" y="164" font-size="17" fill="#1565c0">Il MESURE le transit : ce qui traverse EST la quantité calculée.</text>

    <rect x="90" y="196" width="120" height="66" rx="7" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="150" y="236" font-size="17" font-weight="600" fill="#263238" text-anchor="middle">amont</text>

    <rect x="380" y="184" width="240" height="90" rx="8" fill="#ffffff" stroke="#0d47a1" stroke-width="2.5"/>
    <text x="500" y="212" font-size="18" font-weight="700" fill="#0d47a1" text-anchor="middle">composant</text>
    <text x="500" y="240" font-size="16" fill="#6a1b9a" text-anchor="middle">le couple écrit le flux</text>
    <text x="500" y="262" font-size="15" fill="#9e9e9e" text-anchor="middle" text-decoration="line-through">transfert identité</text>

    <rect x="790" y="196" width="120" height="66" rx="7" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="850" y="236" font-size="17" font-weight="600" fill="#263238" text-anchor="middle">aval</text>

    <line x1="210" y1="229" x2="372" y2="229" stroke="#37474f" stroke-width="4" marker-end="url(#tp-flow)"/>
    <text x="291" y="219" font-size="16" fill="#37474f" text-anchor="middle" font-weight="600">Q</text>
    <line x1="620" y1="229" x2="782" y2="229" stroke="#37474f" stroke-width="4" marker-end="url(#tp-flow)"/>
    <text x="701" y="219" font-size="16" fill="#37474f" text-anchor="middle" font-weight="600">Q</text>

    <text x="950" y="222" font-size="16" fill="#0d47a1" font-weight="600">le flux QUITTE</text>
    <text x="950" y="246" font-size="16" fill="#0d47a1">le résidu identité</text>
  </g>

  <g id="two-flow">
    <rect x="40" y="336" width="1040" height="216" rx="10" fill="#f6f3fb" stroke="#6a1b9a" stroke-width="2"/>
    <text x="64" y="370" font-size="20" font-weight="700" fill="#4a148c">DEUX FLUX · flows = ("chaleur_eau", "chaleur_air")</text>
    <text x="64" y="396" font-size="17" fill="#6a1b9a">Il DÉPLACE entre deux courants qui continuent de transiter, en delta signé.</text>

    <rect x="90" y="424" width="120" height="48" rx="7" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="150" y="454" font-size="16" font-weight="600" fill="#263238" text-anchor="middle">eau</text>
    <rect x="90" y="486" width="120" height="48" rx="7" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="150" y="516" font-size="16" font-weight="600" fill="#263238" text-anchor="middle">air</text>

    <rect x="380" y="414" width="240" height="128" rx="8" fill="#ffffff" stroke="#4a148c" stroke-width="2.5"/>
    <text x="500" y="440" font-size="18" font-weight="700" fill="#4a148c" text-anchor="middle">échangeur</text>
    <line x1="396" y1="466" x2="604" y2="466" stroke="#37474f" stroke-width="3.5" marker-end="url(#tp-flow)"/>
    <line x1="396" y1="522" x2="604" y2="522" stroke="#37474f" stroke-width="3.5" marker-end="url(#tp-flow)"/>
    <path d="M 500 474 L 500 514" stroke="#6a1b9a" stroke-width="5" marker-end="url(#tp-move)"/>
    <text x="530" y="500" font-size="17" font-weight="700" fill="#6a1b9a">Q</text>

    <rect x="790" y="424" width="120" height="48" rx="7" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="850" y="454" font-size="16" font-weight="600" fill="#263238" text-anchor="middle">eau − Q</text>
    <rect x="790" y="486" width="120" height="48" rx="7" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="850" y="516" font-size="16" font-weight="600" fill="#263238" text-anchor="middle">air + Q</text>

    <line x1="210" y1="448" x2="372" y2="448" stroke="#37474f" stroke-width="4" marker-end="url(#tp-flow)"/>
    <line x1="210" y1="510" x2="372" y2="510" stroke="#37474f" stroke-width="4" marker-end="url(#tp-flow)"/>
    <line x1="620" y1="448" x2="782" y2="448" stroke="#37474f" stroke-width="4" marker-end="url(#tp-flow)"/>
    <line x1="620" y1="510" x2="782" y2="510" stroke="#37474f" stroke-width="4" marker-end="url(#tp-flow)"/>

    <text x="950" y="462" font-size="16" fill="#4a148c" font-weight="600">les deux RESTENT</text>
    <text x="950" y="486" font-size="16" fill="#4a148c">dans le résidu</text>
  </g>

  <g id="warning">
    <rect x="40" y="568" width="1040" height="38" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.8"/>
    <text x="64" y="593" font-size="16" fill="#b71c1c"><tspan font-weight="700">Les confondre :</tspan> retirer les courants d'un couple à deux flux et l'échangeur ne transporte plus rien ; laisser le flux d'un conduit et il traverse deux fois.</text>
  </g>
</svg>
