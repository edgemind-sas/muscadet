<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <rect x="0" y="0" width="1120" height="480" fill="#ffffff"/>

  <defs>
    <marker id="dh-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f57f17"/></marker>
    <marker id="dh-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/></marker>
    <marker id="dh-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00695c"/></marker>
  </defs>

  <text x="36" y="42" font-size="24" font-weight="700" fill="#212121">Domestic hot water: the model</text>

  <g id="legend">
    <line x1="640" y1="36" x2="676" y2="36" stroke="#f57f17" stroke-width="5"/>
    <text x="684" y="42" font-size="15" fill="#f57f17" font-weight="600">electricity</text>
    <line x1="790" y1="36" x2="826" y2="36" stroke="#c62828" stroke-width="5" stroke-dasharray="9 5"/>
    <text x="834" y="42" font-size="15" fill="#c62828" font-weight="600">heat</text>
    <line x1="900" y1="36" x2="936" y2="36" stroke="#00695c" stroke-width="3" stroke-dasharray="2 4"/>
    <text x="944" y="42" font-size="15" fill="#00695c" font-weight="600">signal</text>
  </g>

  <rect x="36" y="96" width="140" height="64" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="2"/>
  <text x="106" y="122" font-size="15" font-weight="700" fill="#e65100" text-anchor="middle">SUPPLY · pump</text>
  <text x="106" y="146" font-size="15" fill="#e65100" text-anchor="middle">2 kW</text>

  <rect x="36" y="250" width="140" height="64" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="2"/>
  <text x="106" y="276" font-size="15" font-weight="700" fill="#e65100" text-anchor="middle">SUPPLY · backup</text>
  <text x="106" y="300" font-size="15" fill="#e65100" text-anchor="middle">3 kW</text>

  <rect x="256" y="88" width="192" height="80" rx="7" fill="#ffffff" stroke="#1565c0" stroke-width="2.5"/>
  <text x="352" y="114" font-size="17" font-weight="700" fill="#0d47a1" text-anchor="middle">HEAT PUMP</text>
  <text x="352" y="138" font-size="15" fill="#37474f" text-anchor="middle">2 elec → 7 heat</text>
  <text x="352" y="158" font-size="15" font-weight="600" fill="#1565c0" text-anchor="middle">COP 3.5</text>

  <rect x="256" y="242" width="192" height="80" rx="7" fill="#ffffff" stroke="#78909c" stroke-width="2.5"/>
  <text x="352" y="268" font-size="17" font-weight="700" fill="#455a64" text-anchor="middle">BACKUP</text>
  <text x="352" y="292" font-size="15" fill="#37474f" text-anchor="middle">3 elec → 3 heat</text>
  <text x="352" y="312" font-size="15" font-weight="600" fill="#455a64" text-anchor="middle">COP 1</text>

  <rect x="552" y="150" width="180" height="130" rx="7" fill="#fffde7" stroke="#f9a825" stroke-width="3"/>
  <text x="642" y="180" font-size="17" font-weight="700" fill="#263238" text-anchor="middle">CYLINDER</text>
  <text x="642" y="206" font-size="15" fill="#546e7a" text-anchor="middle">200 L · 0.2325 kWh/K</text>
  <text x="642" y="232" font-size="15" fill="#546e7a" text-anchor="middle">15 → 60 °C</text>
  <text x="642" y="262" font-size="16" font-weight="700" fill="#b71c1c" text-anchor="middle">10.46 kWh</text>

  <rect x="552" y="340" width="180" height="72" rx="7" fill="#e0f2f1" stroke="#00695c" stroke-width="2.5"/>
  <text x="642" y="366" font-size="16" font-weight="700" fill="#004d40" text-anchor="middle">THERMOSTAT</text>
  <text x="642" y="390" font-size="15" fill="#00695c" text-anchor="middle">on &lt; 55 °C · off &gt; 60 °C</text>

  <rect x="828" y="150" width="176" height="80" rx="7" fill="#ffffff" stroke="#6a1b9a" stroke-width="2.5"/>
  <text x="916" y="176" font-size="16" font-weight="700" fill="#4a148c" text-anchor="middle">LOSS · conduit</text>
  <text x="916" y="200" font-size="15" fill="#546e7a" text-anchor="middle">UA · (T − 15)</text>
  <text x="916" y="220" font-size="15" font-weight="600" fill="#4a148c" text-anchor="middle">0.0625 kW at 60 °C</text>

  <rect x="828" y="268" width="176" height="56" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  <text x="916" y="302" font-size="16" font-weight="600" fill="#455a64" text-anchor="middle">AMBIENT 15 °C</text>

  <line x1="176" y1="128" x2="248" y2="128" stroke="#f57f17" stroke-width="4.5" marker-end="url(#dh-e)"/>
  <line x1="176" y1="282" x2="248" y2="282" stroke="#f57f17" stroke-width="4.5" marker-end="url(#dh-e)"/>

  <line x1="448" y1="128" x2="544" y2="176" stroke="#c62828" stroke-width="4.5" stroke-dasharray="9 5" marker-end="url(#dh-h)"/>
  <text x="484" y="134" font-size="16" font-weight="700" fill="#c62828">7 kW</text>
  <line x1="448" y1="282" x2="544" y2="252" stroke="#c62828" stroke-width="4.5" stroke-dasharray="9 5" marker-end="url(#dh-h)"/>
  <text x="484" y="286" font-size="16" font-weight="700" fill="#c62828">3 kW</text>

  <line x1="732" y1="190" x2="820" y2="190" stroke="#c62828" stroke-width="4" stroke-dasharray="9 5" marker-end="url(#dh-h)"/>
  <line x1="916" y1="230" x2="916" y2="260" stroke="#c62828" stroke-width="4" stroke-dasharray="9 5" marker-end="url(#dh-h)"/>

  <path d="M 552 376 L 480 376 L 480 340 L 352 340 L 352 328" fill="none" stroke="#00695c" stroke-width="3"
        stroke-dasharray="2 4" marker-end="url(#dh-s)"/>
  <path d="M 592 340 L 592 186 L 548 186" fill="none" stroke="#00695c" stroke-width="3"
        stroke-dasharray="2 4" marker-end="url(#dh-s)"/>
  <path d="M 448 168 L 500 168 L 500 336 L 470 336 L 470 328" fill="none" stroke="#00695c" stroke-width="3"
        stroke-dasharray="2 4" marker-end="url(#dh-s)"/>
  <text x="506" y="356" font-size="14" fill="#00695c">pump healthy?</text>

  <path d="M 828 186 L 800 186 L 800 122 L 646 122 L 646 146" fill="none" stroke="#00695c" stroke-width="3"
        stroke-dasharray="2 4" marker-end="url(#dh-s)"/>
  <text x="714" y="114" font-size="14" fill="#00695c">level</text>
</svg>
