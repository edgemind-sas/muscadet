<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <rect x="0" y="0" width="1180" height="760" fill="#ffffff"/>

  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a1b9a"/></marker>
  </defs>

  <g id="title">
    <text x="40" y="44" font-size="26" font-weight="700" fill="#212121">Advection : ce qu'une simulation doit afficher</text>
    <text x="40" y="72" font-size="17" fill="#546e7a">Cuve alimentée à 80 °C, vidangée au même débit. Valeurs à confronter au modèle.</text>
  </g>

  <g id="legend">
    <line x1="700" y1="38" x2="740" y2="38" stroke="#1565c0" stroke-width="5"/>
    <text x="748" y="44" font-size="16" fill="#1565c0" font-weight="600">eau</text>
    <line x1="800" y1="38" x2="840" y2="38" stroke="#c62828" stroke-width="5" stroke-dasharray="9 5"/>
    <text x="848" y="44" font-size="16" fill="#c62828" font-weight="600">chaleur</text>
    <line x1="930" y1="38" x2="970" y2="38" stroke="#6a1b9a" stroke-width="3" stroke-dasharray="2 4"/>
    <text x="978" y="44" font-size="16" fill="#6a1b9a" font-weight="600">mesure</text>
  </g>

  <g id="row-t0">
    <rect x="30" y="96" width="1120" height="196" rx="10" fill="#f5f7fa" stroke="#b0bec5" stroke-width="1.5"/>
    <text x="52" y="128" font-size="21" font-weight="700" fill="#263238">t = 0 h</text>
    <text x="52" y="154" font-size="16" fill="#546e7a">départ</text>

    <rect x="150" y="150" width="130" height="70" rx="7" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="215" y="180" font-size="17" font-weight="600" fill="#263238" text-anchor="middle">SOURCE</text>
    <text x="215" y="203" font-size="16" fill="#1565c0" text-anchor="middle">2,0 /h</text>

    <rect x="360" y="150" width="130" height="70" rx="7" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="425" y="180" font-size="17" font-weight="600" fill="#263238" text-anchor="middle">ENTRÉE</text>
    <text x="425" y="203" font-size="15" fill="#546e7a" text-anchor="middle">règle</text>

    <rect x="570" y="140" width="150" height="90" rx="7" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/>
    <text x="645" y="168" font-size="17" font-weight="600" fill="#263238" text-anchor="middle">CUVE</text>
    <text x="645" y="192" font-size="16" fill="#1565c0" text-anchor="middle">eau 100</text>
    <text x="645" y="214" font-size="16" fill="#c62828" text-anchor="middle">chaleur 2000</text>

    <rect x="800" y="150" width="130" height="70" rx="7" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="865" y="180" font-size="17" font-weight="600" fill="#263238" text-anchor="middle">MESURE</text>
    <text x="865" y="203" font-size="15" fill="#546e7a" text-anchor="middle">conduit</text>

    <rect x="1010" y="150" width="110" height="70" rx="7" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="1065" y="190" font-size="17" font-weight="600" fill="#263238" text-anchor="middle">PUISAGE</text>

    <line x1="280" y1="172" x2="352" y2="172" stroke="#1565c0" stroke-width="4" marker-end="url(#aw)"/>
    <text x="316" y="162" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="600">2,0</text>

    <line x1="490" y1="164" x2="562" y2="164" stroke="#1565c0" stroke-width="4" marker-end="url(#aw)"/>
    <text x="526" y="154" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="600">2,0</text>
    <line x1="490" y1="200" x2="562" y2="200" stroke="#c62828" stroke-width="4" stroke-dasharray="9 5" marker-end="url(#ah)"/>
    <text x="526" y="222" font-size="15" fill="#c62828" text-anchor="middle" font-weight="600">160</text>

    <line x1="720" y1="185" x2="792" y2="185" stroke="#c62828" stroke-width="4" stroke-dasharray="9 5" marker-end="url(#ah)"/>
    <text x="756" y="175" font-size="15" fill="#c62828" text-anchor="middle" font-weight="600">40</text>

    <line x1="930" y1="185" x2="1002" y2="185" stroke="#c62828" stroke-width="4" stroke-dasharray="9 5" marker-end="url(#ah)"/>

    <path d="M 645 232 L 645 262 L 865 262 L 865 228" fill="none" stroke="#6a1b9a" stroke-width="2.5"
          stroke-dasharray="2 4" marker-end="url(#am)"/>
    <text x="755" y="280" font-size="15" fill="#6a1b9a" text-anchor="middle">eau 100 · chaleur 2000</text>

    <rect x="30" y="96" width="112" height="196" rx="10" fill="none"/>
    <text x="1065" y="128" font-size="20" font-weight="700" fill="#b71c1c" text-anchor="middle">T = 20 °C</text>
  </g>

  <g id="row-t10">
    <rect x="30" y="304" width="1120" height="150" rx="10" fill="#f5f7fa" stroke="#b0bec5" stroke-width="1.5"/>
    <text x="52" y="336" font-size="21" font-weight="700" fill="#263238">t = 10 h</text>

    <rect x="570" y="336" width="150" height="86" rx="7" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/>
    <text x="645" y="362" font-size="17" font-weight="600" fill="#263238" text-anchor="middle">CUVE</text>
    <text x="645" y="386" font-size="16" fill="#1565c0" text-anchor="middle">eau 100</text>
    <text x="645" y="408" font-size="16" fill="#c62828" text-anchor="middle">chaleur 3088</text>

    <line x1="420" y1="379" x2="562" y2="379" stroke="#c62828" stroke-width="4" stroke-dasharray="9 5" marker-end="url(#ah)"/>
    <text x="491" y="368" font-size="15" fill="#c62828" text-anchor="middle" font-weight="600">160</text>
    <text x="491" y="400" font-size="15" fill="#546e7a" text-anchor="middle">entrant</text>

    <line x1="728" y1="379" x2="870" y2="379" stroke="#c62828" stroke-width="4" stroke-dasharray="9 5" marker-end="url(#ah)"/>
    <text x="799" y="368" font-size="15" fill="#c62828" text-anchor="middle" font-weight="600">61,8</text>
    <text x="799" y="400" font-size="15" fill="#546e7a" text-anchor="middle">sortant</text>

    <text x="1065" y="342" font-size="20" font-weight="700" fill="#b71c1c" text-anchor="middle">T = 30,9 °C</text>
    <text x="1000" y="400" font-size="16" fill="#37474f">net + 98,2 /h</text>
  </g>

  <g id="row-t20">
    <rect x="30" y="466" width="1120" height="150" rx="10" fill="#eef7ee" stroke="#66bb6a" stroke-width="2"/>
    <text x="52" y="498" font-size="21" font-weight="700" fill="#1b5e20">t = 20 h</text>

    <rect x="570" y="498" width="150" height="86" rx="7" fill="#ffffff" stroke="#f9a825" stroke-width="2.5"/>
    <text x="645" y="524" font-size="17" font-weight="600" fill="#263238" text-anchor="middle">CUVE</text>
    <text x="645" y="548" font-size="16" fill="#1565c0" text-anchor="middle">eau 100</text>
    <text x="645" y="570" font-size="16" fill="#c62828" text-anchor="middle">chaleur 3978</text>

    <line x1="420" y1="541" x2="562" y2="541" stroke="#c62828" stroke-width="4" stroke-dasharray="9 5" marker-end="url(#ah)"/>
    <text x="491" y="530" font-size="15" fill="#c62828" text-anchor="middle" font-weight="600">160</text>

    <line x1="728" y1="541" x2="870" y2="541" stroke="#c62828" stroke-width="4" stroke-dasharray="9 5" marker-end="url(#ah)"/>
    <text x="799" y="530" font-size="15" fill="#c62828" text-anchor="middle" font-weight="600">79,6</text>

    <text x="1065" y="504" font-size="20" font-weight="700" fill="#1b5e20" text-anchor="middle">T = 39,78 °C</text>
    <text x="985" y="562" font-size="16" font-weight="600" fill="#1b5e20">= analytique</text>
  </g>

  <g id="key">
    <rect x="30" y="632" width="1120" height="104" rx="10" fill="#fff8e1" stroke="#f57f17" stroke-width="1.8"/>
    <text x="52" y="662" font-size="18" font-weight="700" fill="#e65100">Les deux mécanismes, et pourquoi il en faut deux</text>
    <text x="52" y="690" font-size="16" fill="#4e342e">ENTRÉE : règle · cons {eau : 1} → prod {eau : 1, chaleur : 80} · le débit de chaleur suit celui de l'eau, tout seul</text>
    <text x="52" y="716" font-size="16" fill="#4e342e">SORTIE : conduit · déplace q × chaleur/eau · les deux termes bougent, donc aucun coefficient constant ne peut le dire</text>
  </g>
</svg>
