<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" width="1160" height="620"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <rect x="0" y="0" width="1160" height="620" fill="#ffffff"/>

  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a1b9a"/></marker>
  </defs>

  <text x="36" y="44" font-size="24" font-weight="700" fill="#212121">Advection: rates at three stops</text>
  <text x="36" y="70" font-size="16" fill="#546e7a">Tank fed at 80 degrees, drained at the same rate. Volume 100, inflow 2 per hour.</text>

  <g id="legend">
    <line x1="700" y1="38" x2="736" y2="38" stroke="#1565c0" stroke-width="5"/>
    <text x="744" y="44" font-size="15" fill="#1565c0" font-weight="600">water</text>
    <line x1="812" y1="38" x2="848" y2="38" stroke="#c62828" stroke-width="5" stroke-dasharray="9 5"/>
    <text x="856" y="44" font-size="15" fill="#c62828" font-weight="600">heat</text>
    <line x1="920" y1="38" x2="956" y2="38" stroke="#6a1b9a" stroke-width="3" stroke-dasharray="2 4"/>
    <text x="964" y="44" font-size="15" fill="#6a1b9a" font-weight="600">measurement</text>
  </g>

  <g id="t0">
    <rect x="36" y="92" width="1088" height="186" rx="9" fill="#f5f7fa" stroke="#b0bec5" stroke-width="1.5"/>
    <text x="58" y="122" font-size="19" font-weight="700" fill="#263238">t = 0 h</text>

    <rect x="140" y="146" width="120" height="62" rx="6" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="200" y="172" font-size="15" font-weight="600" fill="#263238" text-anchor="middle">SOURCE</text>
    <text x="200" y="193" font-size="15" fill="#1565c0" text-anchor="middle">2.0 /h</text>

    <rect x="336" y="146" width="120" height="62" rx="6" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="396" y="172" font-size="15" font-weight="600" fill="#263238" text-anchor="middle">INLET</text>
    <text x="396" y="193" font-size="14" fill="#546e7a" text-anchor="middle">rule</text>

    <rect x="532" y="138" width="146" height="80" rx="6" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/>
    <text x="605" y="163" font-size="15" font-weight="700" fill="#263238" text-anchor="middle">TANK</text>
    <text x="605" y="185" font-size="15" fill="#1565c0" text-anchor="middle">water 100</text>
    <text x="605" y="206" font-size="15" fill="#c62828" text-anchor="middle">heat 2000</text>

    <rect x="754" y="146" width="120" height="62" rx="6" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="814" y="172" font-size="15" font-weight="600" fill="#263238" text-anchor="middle">METER</text>
    <text x="814" y="193" font-size="14" fill="#546e7a" text-anchor="middle">conduit</text>

    <rect x="950" y="146" width="110" height="62" rx="6" fill="#ffffff" stroke="#455a64" stroke-width="2"/>
    <text x="1005" y="183" font-size="15" font-weight="600" fill="#263238" text-anchor="middle">DRAW</text>

    <line x1="260" y1="168" x2="328" y2="168" stroke="#1565c0" stroke-width="4" marker-end="url(#aw)"/>
    <text x="294" y="159" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="600">2.0</text>

    <line x1="456" y1="160" x2="524" y2="160" stroke="#1565c0" stroke-width="4" marker-end="url(#aw)"/>
    <text x="490" y="151" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="600">2.0</text>
    <line x1="456" y1="196" x2="524" y2="196" stroke="#c62828" stroke-width="4" stroke-dasharray="9 5" marker-end="url(#ah)"/>
    <text x="490" y="217" font-size="14" fill="#c62828" text-anchor="middle" font-weight="600">160</text>

    <line x1="678" y1="177" x2="746" y2="177" stroke="#c62828" stroke-width="4" stroke-dasharray="9 5" marker-end="url(#ah)"/>
    <text x="712" y="168" font-size="14" fill="#c62828" text-anchor="middle" font-weight="600">40</text>
    <line x1="874" y1="177" x2="942" y2="177" stroke="#c62828" stroke-width="4" stroke-dasharray="9 5" marker-end="url(#ah)"/>

    <path d="M 605 220 L 605 248 L 814 248 L 814 216" fill="none" stroke="#6a1b9a" stroke-width="2.5"
          stroke-dasharray="2 4" marker-end="url(#am)"/>
    <text x="710" y="266" font-size="14" fill="#6a1b9a" text-anchor="middle">water 100 · heat 2000</text>

    <text x="1005" y="122" font-size="18" font-weight="700" fill="#b71c1c" text-anchor="middle">T = 20.0 °C</text>
  </g>

  <g id="t10">
    <rect x="36" y="290" width="1088" height="140" rx="9" fill="#f5f7fa" stroke="#b0bec5" stroke-width="1.5"/>
    <text x="58" y="320" font-size="19" font-weight="700" fill="#263238">t = 10 h</text>

    <rect x="532" y="320" width="146" height="80" rx="6" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/>
    <text x="605" y="345" font-size="15" font-weight="700" fill="#263238" text-anchor="middle">TANK</text>
    <text x="605" y="367" font-size="15" fill="#1565c0" text-anchor="middle">water 100</text>
    <text x="605" y="388" font-size="15" fill="#c62828" text-anchor="middle">heat 3088</text>

    <line x1="400" y1="360" x2="524" y2="360" stroke="#c62828" stroke-width="4" stroke-dasharray="9 5" marker-end="url(#ah)"/>
    <text x="462" y="350" font-size="14" fill="#c62828" text-anchor="middle" font-weight="600">160 in</text>

    <line x1="686" y1="360" x2="810" y2="360" stroke="#c62828" stroke-width="4" stroke-dasharray="9 5" marker-end="url(#ah)"/>
    <text x="748" y="350" font-size="14" fill="#c62828" text-anchor="middle" font-weight="600">61.8 out</text>

    <text x="1005" y="326" font-size="18" font-weight="700" fill="#b71c1c" text-anchor="middle">T = 30.9 °C</text>
    <text x="1005" y="380" font-size="15" fill="#37474f" text-anchor="middle">net + 98.2 /h</text>
  </g>

  <g id="t20">
    <rect x="36" y="442" width="1088" height="140" rx="9" fill="#eef7ee" stroke="#66bb6a" stroke-width="2"/>
    <text x="58" y="472" font-size="19" font-weight="700" fill="#1b5e20">t = 20 h</text>

    <rect x="532" y="472" width="146" height="80" rx="6" fill="#ffffff" stroke="#f9a825" stroke-width="2.5"/>
    <text x="605" y="497" font-size="15" font-weight="700" fill="#263238" text-anchor="middle">TANK</text>
    <text x="605" y="519" font-size="15" fill="#1565c0" text-anchor="middle">water 100</text>
    <text x="605" y="540" font-size="15" fill="#c62828" text-anchor="middle">heat 3978</text>

    <line x1="400" y1="512" x2="524" y2="512" stroke="#c62828" stroke-width="4" stroke-dasharray="9 5" marker-end="url(#ah)"/>
    <text x="462" y="502" font-size="14" fill="#c62828" text-anchor="middle" font-weight="600">160 in</text>

    <line x1="686" y1="512" x2="810" y2="512" stroke="#c62828" stroke-width="4" stroke-dasharray="9 5" marker-end="url(#ah)"/>
    <text x="748" y="502" font-size="14" fill="#c62828" text-anchor="middle" font-weight="600">79.6 out</text>

    <text x="1005" y="478" font-size="18" font-weight="700" fill="#1b5e20" text-anchor="middle">T = 39.78 °C</text>
    <text x="1005" y="532" font-size="15" font-weight="600" fill="#1b5e20" text-anchor="middle">analytic 39.78</text>
  </g>
</svg>
