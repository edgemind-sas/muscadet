<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 380" width="1300" height="380"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <rect x="0" y="0" width="1300" height="380" fill="#ffffff"/>

  <defs>
    <marker id="p-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/></marker>
    <marker id="p-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f57f17"/></marker>
    <marker id="p-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/></marker>
    <marker id="p-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a1b9a"/></marker>
  </defs>

  <text x="36" y="42" font-size="24" font-weight="700" fill="#212121">Electrolysis plant: the model</text>

  <g id="legend">
    <line x1="700" y1="36" x2="736" y2="36" stroke="#1565c0" stroke-width="5"/>
    <text x="744" y="42" font-size="15" fill="#1565c0" font-weight="600">H2O</text>
    <line x1="806" y1="36" x2="842" y2="36" stroke="#f57f17" stroke-width="5"/>
    <text x="850" y="42" font-size="15" fill="#f57f17" font-weight="600">electricity</text>
    <line x1="954" y1="36" x2="990" y2="36" stroke="#2e7d32" stroke-width="5" stroke-dasharray="9 5"/>
    <text x="998" y="42" font-size="15" fill="#2e7d32" font-weight="600">H2 / O2</text>
    <line x1="1084" y1="36" x2="1120" y2="36" stroke="#6a1b9a" stroke-width="3" stroke-dasharray="2 4"/>
    <text x="1128" y="42" font-size="15" fill="#6a1b9a" font-weight="600">measurement</text>
  </g>

  <g id="sources">
    <rect x="36" y="96" width="184" height="72" rx="7" fill="#e8f2fb" stroke="#1565c0" stroke-width="2.5"/>
    <text x="128" y="122" font-size="16" font-weight="700" fill="#0d47a1" text-anchor="middle">S_H2O</text>
    <text x="128" y="146" font-size="15" fill="#1565c0" text-anchor="middle">SourceContinuous · 2</text>

    <rect x="36" y="220" width="184" height="92" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
    <text x="128" y="246" font-size="16" font-weight="700" fill="#1b5e20" text-anchor="middle">B1 · battery</text>
    <text x="128" y="270" font-size="15" fill="#2e7d32" text-anchor="middle">CapacityContinuous</text>
    <text x="128" y="292" font-size="15" fill="#2e7d32" text-anchor="middle">capacity 100, stocked 100</text>
  </g>

  <g id="stack">
    <rect x="376" y="132" width="248" height="140" rx="8" fill="#ffffff" stroke="#1b5e20" stroke-width="3"/>
    <text x="500" y="162" font-size="18" font-weight="700" fill="#1b5e20" text-anchor="middle">Electro</text>
    <text x="500" y="188" font-size="15" fill="#546e7a" text-anchor="middle">TransformerContinuous</text>
    <text x="500" y="216" font-size="16" fill="#2e7d32" text-anchor="middle">4 H2O + 1 Elec</text>
    <text x="500" y="240" font-size="16" fill="#2e7d32" text-anchor="middle">→ 1 H2 + 1 O2</text>
    <text x="500" y="264" font-size="14" fill="#c62828" text-anchor="middle">df_H2: down 2 → 4 h</text>
  </g>

  <g id="tank">
    <rect x="780" y="132" width="200" height="100" rx="7" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
    <text x="880" y="162" font-size="16" font-weight="700" fill="#1b5e20" text-anchor="middle">Local · H2 store</text>
    <text x="880" y="186" font-size="15" fill="#2e7d32" text-anchor="middle">CapacityContinuous</text>
    <text x="880" y="210" font-size="15" fill="#2e7d32" text-anchor="middle">capacity 6, stocked 3</text>
  </g>

  <g id="vent">
    <rect x="780" y="288" width="200" height="56" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
    <text x="880" y="313" font-size="15" font-weight="600" fill="#455a64" text-anchor="middle">O2 · produced,</text>
    <text x="880" y="334" font-size="15" fill="#546e7a" text-anchor="middle">wired to nothing</text>
  </g>

  <line x1="220" y1="132" x2="368" y2="176" stroke="#1565c0" stroke-width="4.5" marker-end="url(#p-w)"/>
  <text x="272" y="142" font-size="15" fill="#1565c0" font-weight="600">2.0</text>

  <line x1="220" y1="266" x2="368" y2="228" stroke="#f57f17" stroke-width="4.5" marker-end="url(#p-e)"/>
  <text x="272" y="266" font-size="15" fill="#e65100" font-weight="600">0.5 asked</text>

  <line x1="624" y1="176" x2="772" y2="176" stroke="#2e7d32" stroke-width="4.5" stroke-dasharray="9 5" marker-end="url(#p-h)"/>
  <text x="698" y="166" font-size="15" fill="#1b5e20" font-weight="600">H2 0.5</text>

  <line x1="624" y1="240" x2="772" y2="308" stroke="#2e7d32" stroke-width="4.5" stroke-dasharray="9 5" marker-end="url(#p-h)"/>
  <text x="690" y="290" font-size="15" fill="#1b5e20" font-weight="600">O2 0.5</text>

</svg>
