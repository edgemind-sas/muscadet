name: docs

# Builds the documentation site on every pull request, and publishes it to
# GitHub Pages on every push to master. Only the docs dependency group is
# installed: mkdocstrings reads the sources statically, so neither cod3s nor
# PyCATSHOO is needed (PyCATSHOO could not be installed here anyway).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          # The runner has no system Python 3.10: uv provides one in a venv,
          # put on PATH so the next steps find mkdocs.
          activate-environment: true
      - name: Install the docs group alone
        run: uv pip install --group docs
      - name: Build (strict)
        run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
